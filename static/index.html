<!doctype html>
<html land="en">
<head>
<style>
:root {
	--tile-size: 256px;
	--tile-grid: calc(var(--tile-size) + 20px);
}
html,body,page-top {
	margin: 0;
	display: flex;
	flex-direction: row;
	height: 100%;
	width: 100%;
	overflow: clip;
}
page-main {
	margin: 0;
	display: flex;
	flex-direction: column;
	flex: 0 0 80%;
	height: 100%;
	width: 80%;
	overflow: auto;
}
page-sidebar {
	display: flex;
	flex-direction: column;
	flex: 0 0 20%;
	width: 20%;
	height: 100%;
	background-color: #aaa;
	border-right: 2px solid black;
	box-sizing: border-box;
	padding: 10px;
}
sidebar-info {
}
sidebar-tags {
}
sidebar-more {
}

header {
	height: 2em;
	background-color: #c00;
}
footer {
	height: 2em;
	background-color: #0c0;
}
tile-grid {
	display: grid;
	grid-template-rows: var(--tile-grid);
	grid-auto-rows: var(--tile-grid);
	grid-template-columns: repeat(auto-fit, minmax(var(--tile-grid), 1fr));
	gap: 3px;
	background-color: #eee;
	height: 100%;
	overflow: auto;
}
img-tile {
        display: flex;
	flex-direction: column;
	margin: auto;
	background-color: #eee;
	border: 3px solid #eee;
	border-radius: 7px;
	position: relative;
}
img-clip {
	display: flex;
        width: var(--tile-size);
        height: var(--tile-size);
	overflow: clip;
        justify-content: center; /* or: end */
	align-items: center;
}
img-wrap {
	display: flex;
	max-width: 100%;
	max-height: 100%;
	position: relative;
}
.focused {
	border: 3px solid #0f0;
	background-color: #0f0;
}
.focused > img-clip > img-wrap > img {
	border-radius: 7px;
}
img-wrap img {
        max-width: 100%;
        max-height: 100%;
	object-fit: contain;
}
view-pane {
	display: none;
	width: 100%;
	height: 100%;
	overflow: auto;
	background-color: black;

	justify-content: center;
	align-items: center;
}
view-pane-div {
	height: 100%;
	align-content: center;
}
view-pane-div video {
	display: none;
	max-width: 100%;
	max-height: 100%;
}
.img-no-zoom {
	max-width: 100%;
	max-height: 100%;
}

dl {
	display: grid;
	grid-template-columns: min-content max-content;
	width: 100%;
}
dt {
	text-align: right;
	font-weight: bold;
}
dd {
	text-align: left;
}

.selected > img-clip > img-wrap > tile-icon {
	display: block;
	width: 30px;
	height: 30px;
	background-color: #00f;
	border-radius: 50px;
	z-index: 1;
	position: absolute;
	top: 5px;
	right: 5px;
	border: 2px solid #fff;
}
info-tag {
	display: block;
	z-index: 1;
	background-color: #000b;
	color: #fff;
	border-radius: 3px;
	position: absolute;
	left: 5px;
	bottom: 5px;
	padding: 0px 3px 0px 3px;
	font-family: sans-serif;
	font-weight: bold;
	font-size: 10pt;
}

comp-anchor {
	position: relative;
	width: 100%;
}
comp-list {
	z-index: 2;
	position: absolute;
	top: 3px;
	background-color: #fff;
	border: 2px solid black;
	display: none;
}
comp-list > ul {
	list-style: none;
	padding: 0px;
	margin: 5px;
}
comp-list > ul > li {
	/* list-style: none; */
	margin-top: 5px;
}

input.selected {
	background-color: #99f;
}
li.selected {
	background-color: #ff9;
}

sidebar-label {
	margin-top: 10px;
	margin-bottom: 10px;
	font-weight: bold;
}
</style>

</head>
<body>
<page-top>
 <page-sidebar id="sidebar">
  <sidebar-label>Search:</sidebar-label>
  <input type="text" id="filter-text">
  <comp-anchor><comp-list id="filter-suggest" /></comp-anchor>
  <sidebar-label id="add-tag-label">Add Tag:</sidebar-label>
  <input type="text" id="add-tag-text">
  <comp-anchor><comp-list id="add-tag-suggest" /></comp-anchor>
  <sidebar-info id="infobox"></sidebar-info>
  <sidebar-tags id="infotags"></sidebar-tags>
  <sidebar-more id="moretags"></sidebar-more>
 </page-sidebar>
 <page-main>
  <view-pane id="viewer">
   <view-pane-div>
    <img class="img-no-zoom" id="viewer-img" />
    <video id="viewer-vid" controls loop></video>
   </view-pane-div>
  </view-pane>
  <tile-grid id="tilegrid"> </tile-grid>
 </page-main>
</page-top>
</body>
<script src="index.js"></script>
</html>
