<!doctype html>
<html lang="en">
<head>
<link rel="stylesheet" type="text/css" href="app.css" />
</head>
<body>
<page-top>
 <page-sidebar id="sidebar">
  <sidebar-label>Search:</sidebar-label>
  <input type="text" id="search-text">
  <comp-anchor><comp-list id="search-comp" /></comp-anchor>
  <sidebar-label id="addtag-label">Add Tag:</sidebar-label>
  <input type="text" id="addtag-text">
  <comp-anchor><comp-list id="addtag-comp" /></comp-anchor>
  <sidebar-pane id="infobox"></sidebar-pane>
  <sidebar-pane id="infotags"></sidebar-pane>
  <sidebar-label id="quicktags-label" style="margin-top: auto"></sidebar-label>
  <sidebar-pane id="quicktags"></sidebar-pane>
 </page-sidebar>
 <page-main>
  <view-pane id="viewer">
   <view-pane-div>
    <img class="img-no-zoom" id="viewer-img" />
    <video id="viewer-vid" controls loop></video>
   </view-pane-div>
  </view-pane>
  <tile-grid id="tilegrid"> </tile-grid>
 </page-main>
 <alert-bar id="alert-bar"></alert-bar>
</page-top>
</body>
<script src="index.js"></script>
</html>
